seo:
  title: "Donate"
  description: >
    Support AMVerge development. Buy the team a coffee to help cover domain, hosting, and server costs.

header:
  eyebrow: "Support the project"
  titlePrefix: "Buy me a"
  titleAccent: "coffee"
  subtitle: >
    AMVerge is free and open source. No feature paywalls or premium tiers.

cards:
  - id: obligation
    icon: heart
    title: "No obligation"
    text: >
      You don't have to donate to download releases, report bugs, suggest features,
      or ask questions on Discord. This page is only here for anyone who wants to say thanks.

  - id: support
    icon: server
    title: "Where support goes"
    text: >
      Donations cover domain renewals, docs backend hosting, and the download counter server.
      There are no sponsors, ads, or tracking.

  - id: return
    icon: star
    title: "What to expect"
    text: >
      The project stays open source and updates continue on GitHub regardless of donations.
      Sharing AMVerge with other editors is just as helpful.

  - id: otherWays
    icon: share
    title: "Other ways to help"
    text: >
      Giving the repository a star on GitHub, reporting bugs, or contributing code
      and docs fixes all help the project move forward.

  - id: whyBuilt
    icon: code
    title: "Why we built this"
    text: >
      Manually scrubbing 20-minute episodes for 3-second clips takes too much time.
      We built a tool to solve that workflow problem for our own edits and shared it with everyone.

  - id: nobodyDonates
    icon: smile
    title: "What if nobody donates?"
    text: >
      Nothing changes. Development continues because we use and enjoy the tool ourselves.

cta:
  title: "Tip the project"
  text: >
    If AMVerge saved you editing time and you want to tip in a few dollars for server costs,
    it's always appreciated.
  buttonText: "Buy Me a Coffee"
  buttonUrl: "https://buymeacoffee.com/crptk"

thanks: "Thank you for supporting the project!"
