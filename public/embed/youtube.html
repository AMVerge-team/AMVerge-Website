<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>AMVerge Video Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("v") || "";
      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;

      var autoplay = params.get("autoplay") === "1" ? "1" : "0";
      var mute = params.get("mute") === "1" ? "1" : "0";
      var controls = params.get("controls") === "0" ? "0" : "1";
      var loop = params.get("loop") === "1" ? "1" : "0";

      var query = new URLSearchParams({
        autoplay: autoplay,
        mute: mute,
        controls: controls,
        rel: "0",
        modestbranding: "1",
        playsinline: "1",
      });
      if (loop === "1") {
        query.set("loop", "1");
        query.set("playlist", id);
      }

      var iframe = document.createElement("iframe");
      iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) + "?" + query.toString();
      iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
      iframe.setAttribute("allowfullscreen", "true");
      iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
      document.body.appendChild(iframe);
    })();
  </script>
</body>
</html>
